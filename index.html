<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2f28"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Гамлет XXI века</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>

/* Layout: игровой стол (сукно) — слева трек из 7 зон, в центре рабочая зона хода, справа карточка-стимул, шкала и «рука» */
:root{
  --felt:#163f36; --felt-deep:#0f2f28; --felt-line:#2a5a4e;
  --paper:#f7f1e3; --paper-2:#efe6d0; --ink:#26221c; --ink-soft:#5d554a;
  --yellow:#f2c94c; --orange:#f4a261; --pink:#ef8fa0; --violet:#c3a6ee; --blue:#8fc1ef; --green:#9fd8a6; --red:#e2574c; --gold:#ffd77a;
  --chalk:#eef3ee; --chalk-soft:#b9cfc6;
  --f-display:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-body:"Golos Text","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",Consolas,"Courier New",monospace;
  --r:14px; --shadow:0 6px 18px rgba(0,0,0,.35);
  color-scheme:dark;
}
html{font-size:clamp(15px,1.02vw,20px);min-height:100%;background:var(--felt-deep)}
body{background:var(--felt-deep) radial-gradient(ellipse at 50% 0%,#1c4a40 0%,var(--felt) 45%,var(--felt-deep) 100%) no-repeat;background-size:100% 100vh;color:var(--chalk);font-family:var(--f-body);line-height:1.45;min-height:100%;padding-inline:16px;padding-block:12px 24px}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.05}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}

/* --- top bar --- */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.brand{display:flex;align-items:baseline;gap:12px}
.brand h1{font-size:2.3rem;color:var(--paper)}
.brand h1 span{background:linear-gradient(transparent 62%,rgba(242,201,76,.55) 62%)}
.brand small{color:var(--chalk-soft);font-size:.85rem}
.top .spacer{flex:1}
.pill{display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--felt-line);border-radius:999px;padding:6px 14px;font-size:.9rem;color:var(--chalk)}
.ghost{background:transparent;color:var(--chalk-soft);border:1px solid var(--felt-line);border-radius:999px;padding:6px 14px;font-size:.85rem}
.ghost:hover{color:var(--paper);border-color:var(--chalk-soft)}

/* --- team chips --- */
.teams{display:flex;flex-wrap:wrap;gap:10px}
.team{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:center;background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 14px 8px 10px;box-shadow:var(--shadow);min-width:210px;border:3px solid transparent;opacity:.8}
.team.on{opacity:1;border-color:var(--gold);transform:translateY(-2px)}
.team.out{opacity:.45;filter:grayscale(.7)}
.team .dot{width:18px;height:18px;border-radius:50%;grid-row:span 2;border:2px solid var(--ink)}
.team b{font-family:var(--f-display);font-size:1.45rem;line-height:1}
.team .stats{display:flex;gap:12px;font-size:.82rem;color:var(--ink-soft)}
.team .stats span{display:inline-flex;align-items:center;gap:4px}
.team .stats strong{color:var(--ink);font-family:var(--f-mono)}

/* --- board grid --- */
.board{display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr) minmax(300px,400px);gap:16px;align-items:start}
@media (max-width:1100px){.board{grid-template-columns:1fr}}

/* track */
.track{background:rgba(0,0,0,.18);border:1px solid var(--felt-line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.track h3{font-size:1.4rem;color:var(--chalk-soft);padding:0 4px 4px}
.zone{display:flex;align-items:center;gap:10px;border-radius:10px;padding:8px 10px;background:rgba(255,255,255,.04);border:2px dashed transparent;color:var(--chalk-soft);font-size:.92rem}
.zone .n{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.25rem;color:var(--ink)}
.zone .lt{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px solid currentColor;font-family:var(--f-display);font-size:1rem;margin-left:auto}
.zone.cur{background:var(--paper);color:var(--ink);border-color:var(--ink);box-shadow:var(--shadow)}
.zone.done{color:var(--chalk)}
.zone.skip{opacity:.4;text-decoration:line-through}
.track .note{font-size:.78rem;color:var(--chalk-soft);padding:6px 4px 0;border-top:1px dashed var(--felt-line)}

/* paper panels */
.paper{background:var(--paper);color:var(--ink);border-radius:var(--r);box-shadow:var(--shadow);padding:20px 22px;position:relative}
.paper h2{font-size:2.1rem}
.paper .hint{background:var(--paper-2);border-left:5px solid var(--yellow);border-radius:8px;padding:10px 14px;font-size:.95rem;color:var(--ink-soft)}
.work{display:flex;flex-direction:column;gap:16px;min-width:0}
.tag{display:inline-block;font-family:var(--f-display);font-size:1.15rem;padding:0 10px;border-radius:6px;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}

/* buttons */
.btn{background:var(--ink);color:var(--paper);border-radius:12px;padding:12px 20px;font-weight:600;font-size:1rem;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn[disabled]{opacity:.35;cursor:not-allowed;transform:none}
.btn.y{background:var(--yellow);color:var(--ink)}
.btn.lite{background:transparent;color:var(--ink);border:2px solid var(--ink);box-shadow:none}
.big{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border-radius:16px;padding:16px 18px;border:3px solid var(--ink);background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);min-height:120px}
.big:hover{transform:translateY(-2px)}
.big:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.big[disabled]{opacity:.4;cursor:not-allowed;transform:none}
.big .ico{font-family:var(--f-display);font-size:2.2rem;line-height:1}
.big b{font-size:1.15rem}
.big span{font-size:.88rem;color:var(--ink-soft)}
.big.sel{background:var(--yellow)}

/* stimulus card */
.side{display:flex;flex-direction:column;gap:14px}
.stim{background:#fffdf6;color:var(--ink);border-radius:16px;padding:18px 20px 16px;box-shadow:var(--shadow);border:2px solid var(--ink);transform:rotate(-.6deg)}
.stim .k{font-family:var(--f-display);font-size:1.25rem;color:var(--ink-soft)}
.stim q{display:block;font-size:1.28rem;font-weight:600;line-height:1.35;margin:6px 0 12px;quotes:"«" "»"}
.stim .from{font-size:.85rem;color:var(--ink-soft);border-top:1px dashed #cfc5ad;padding-top:8px}
.scale{background:rgba(0,0,0,.25);border:1px solid var(--felt-line);border-radius:var(--r);padding:12px 14px}
.scale .lbl{display:flex;justify-content:space-between;font-size:.8rem;color:var(--chalk-soft)}
.bar{position:relative;height:30px;margin:8px 0 4px;border-radius:8px;background:linear-gradient(90deg,#c9493f 0 20%,#6c7a74 20% 80%,#4f9d63 80% 100%);border:2px solid #0b211c}
.bar .tick{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.35)}
.bar .mk{position:absolute;top:-8px;width:6px;height:42px;margin-left:-3px;background:var(--gold);border:2px solid #0b211c;border-radius:4px;transition:left .7s cubic-bezier(.3,1.4,.5,1)}
.scale .val{font-family:var(--f-mono);font-size:1.6rem;color:var(--paper)}
.scale .log{font-size:.8rem;color:var(--chalk-soft);margin-top:4px;max-height:7.5em;overflow:auto}
.hand{display:flex;gap:8px;flex-wrap:wrap}
.sift{flex:1 1 30%;min-width:96px;background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 10px;border:2px solid var(--ink);font-size:.8rem;line-height:1.2;position:relative}
.sift .L{position:absolute;top:-10px;right:-8px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:1.15rem;border:2px solid var(--ink)}
.sift b{display:block;font-size:.86rem;margin-bottom:2px}
.side h3{font-size:1.35rem;color:var(--chalk-soft)}

/* source cards */
.srcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.src{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;background:#fff;display:flex;flex-direction:column;gap:6px;min-height:150px}
.src .t{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
.src .nm{font-weight:600;line-height:1.25}
.src .st{font-family:var(--f-display);font-size:1.2rem}
.src.back{background:repeating-linear-gradient(45deg,#2f5d52 0 10px,#29544a 10px 20px);color:var(--paper);border-color:#0b211c}
.src.back .t{color:var(--chalk-soft)}
.src.open{background:#fffdf3}
.src .ea{display:flex;gap:10px;font-family:var(--f-mono);font-size:.9rem}
.src .sh{font-size:.82rem;color:var(--ink-soft)}
.src .act{margin-top:auto}
.src .act .btn{padding:8px 12px;font-size:.88rem}
.for{color:#2c7a43}.against{color:#b23a2f}

/* toulmin */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:.9rem;color:var(--ink)}
.chip.sel{background:var(--yellow)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.slot{border:2px dashed var(--ink-soft);border-radius:12px;padding:10px;min-height:92px;display:flex;flex-direction:column;gap:6px;background:#fffdf6;text-align:left;color:var(--ink)}
.slot .h{font-family:var(--f-display);font-size:1.25rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.slot .body{font-size:.88rem}
.slot.ok{border-style:solid;border-color:#2c7a43;background:#eef8ef}
.slot.bad{border-style:solid;border-color:#b23a2f;background:#fbeceb}
.slot .miss{font-size:.75rem;border:1px solid var(--ink-soft);border-radius:999px;padding:2px 8px;background:transparent;color:var(--ink)}
.slot .miss.on{background:var(--ink);color:var(--paper)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:8px}
.opt{background:#fff;color:var(--ink);border:2px solid var(--ink);border-radius:10px;padding:8px 10px;text-align:left;font-size:.9rem}
.opt.sel{background:var(--yellow)}
.verd{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.verd .big{min-height:100px}
.v-true{background:#e3f4e5}.v-fake{background:#fbe3e0}.v-op{background:#e4eefb}.v-ins{background:#ecebe6}
.warn{background:#fff3cd;border:2px solid #d9a400;border-radius:10px;padding:10px 14px;font-size:.92rem;color:var(--ink)}
.res{display:flex;flex-direction:column;gap:8px}
.res .line{display:flex;gap:10px;align-items:baseline;font-size:1rem}
.res .line .d{font-family:var(--f-mono);font-weight:700;min-width:5.5em}
.plus{color:#2c7a43}.minus{color:#b23a2f}
.clue{background:var(--yellow);color:var(--ink);border-radius:10px;padding:10px 14px;transform:rotate(.4deg);border:2px solid var(--ink)}
.dist{background:var(--pink);color:var(--ink);border-radius:10px;padding:10px 14px;border:2px solid var(--ink)}

/* overlay / dice */
.center{display:grid;place-items:center;min-height:62vh}
.die{width:110px;height:110px;background:#fff;border:3px solid var(--ink);border-radius:20px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:14px;box-shadow:0 6px 0 var(--ink)}
.die i{width:20px;height:20px;border-radius:50%;background:var(--ink);place-self:center;visibility:hidden}
.die.roll{animation:roll .9s ease-out}
@keyframes roll{0%{transform:rotate(0) scale(.6)}60%{transform:rotate(320deg) scale(1.1)}100%{transform:rotate(360deg) scale(1)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}.bar .mk{transition:none}}

/* setup */
.setup{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.setup{grid-template-columns:1fr}}
.field{display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.field input,.field select,textarea{font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--ink);background:#fff;color:var(--ink)}
.tinputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
.seg button{background:#fff;color:var(--ink);padding:8px 16px;font-weight:600}
.seg button.on{background:var(--ink);color:var(--paper)}
.qr{background:#fff;padding:12px;border-radius:12px;display:inline-block;border:2px solid var(--ink)}
.rules li{margin-bottom:6px}
.lb{width:100%;border-collapse:collapse;font-size:.95rem}
.lb th,.lb td{border-bottom:1px solid #d8ceb6;padding:8px 6px;text-align:left}
.lb td.num{font-family:var(--f-mono);text-align:right}
.lb th.num{text-align:right}
.win{color:#2c7a43;font-weight:700}.lose{color:#b23a2f;font-weight:700}
.debrief{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
.kv span:nth-child(even){font-family:var(--f-mono);font-weight:700}

/* phone companion */
.phone{width:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.phone>*{min-width:0;max-width:100%}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--felt-deep);z-index:2;padding-block:8px}
.tabs button{flex:none;background:rgba(255,255,255,.08);color:var(--chalk);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem}
.tabs button.on{background:var(--yellow);color:var(--ink)}
.entry{border-bottom:1px dashed #cfc5ad;padding:10px 0}
.entry:last-child{border-bottom:0}
.entry b{display:block}
.entry small{color:var(--ink-soft)}
.jr{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:center;font-size:.85rem}
.jr select{font:inherit;font-size:.82rem;padding:6px;border-radius:8px;border:1.5px solid var(--ink);background:#fff;color:var(--ink);min-width:0}

/* --- дополнения для режимов с телефонами --- */
.small{font-size:.85rem}
.sw{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1.5px solid rgba(0,0,0,.4)}
.onfelt{color:var(--paper);font-size:2.2rem}
.narrow{max-width:640px}.wide{max-width:1150px;margin:0 auto}
.cen{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:12px}
.mode{min-height:150px}.mode .need{color:#b23a2f;font-weight:600;font-size:.8rem}
.qr{background:#fff;padding:10px;border-radius:12px;display:inline-block;border:2px solid var(--ink);line-height:0}
.qr svg{width:220px;height:220px}.qr.big svg{width:min(340px,70vw);height:min(340px,70vw)}.small-qr .qr svg{width:140px;height:140px}
.joinurl{font-size:1rem;word-break:break-all}.code{font-family:var(--f-mono);font-size:2.6rem;letter-spacing:.12em}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px;align-items:start}
@media (max-width:1000px){.lobby{grid-template-columns:1fr}}
.names{display:flex;flex-wrap:wrap;gap:8px}.names .nm{background:#fff;border:2px solid;border-radius:999px;padding:4px 12px;font-weight:600}
.teamcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.tcol{box-shadow:none;border:2px solid var(--ink);padding:12px}
.proj{display:grid;grid-template-columns:minmax(0,1fr) minmax(220px,300px);gap:16px;align-items:start}
@media (max-width:1000px){.proj{grid-template-columns:1fr}}
.projmain{display:flex;flex-direction:column;gap:16px;min-width:0}
.projmain .stim q{font-size:1.9rem}
.timer{font-size:2rem;font-weight:700;color:var(--ink)}
.prog{display:flex;flex-wrap:wrap;gap:8px}
.pu{display:flex;flex-direction:column;gap:2px;background:#fff;border:3px solid;border-radius:10px;padding:6px 10px;min-width:110px;font-size:.88rem}
.pu b{font-size:.85rem;color:var(--ink-soft)}.pu.ok{background:#e3f4e5}.pu.ok b{color:#2c7a43}.pu.out{opacity:.45}
.dist-bars{display:flex;flex-direction:column;gap:6px}
.db{display:grid;grid-template-columns:11em 1fr 2.5em;gap:10px;align-items:center}
.dbar{height:18px;background:#e7dfcb;border-radius:6px;overflow:hidden}.dbar i{display:block;height:100%;background:#9a8f78}
.db.right .dbar i{background:#4f9d63}.db.right span{font-weight:700}
.tblwrap{overflow-x:auto}.lb.compact td{padding:5px 4px}
.plus{color:#2c7a43}.minus{color:#b23a2f}
.phone-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.brandsm{font-family:var(--f-display);font-size:1.7rem;color:var(--paper)}
.meline{padding:12px 16px}
.stats-row{display:flex;flex-wrap:wrap;gap:12px;font-size:.88rem;color:var(--ink-soft)}.stats-row b{color:var(--ink);font-family:var(--f-mono)}
.team .stats-row{grid-column:2}
.linkbtn{background:none;border:0;color:#2a5aa8;text-decoration:underline;padding:0;font-size:inherit}
.ro .big,.ro .btn,.ro .opt,.ro .chip,.ro .slot{opacity:.75}
.sub{font-size:1.5rem;margin:16px 0 8px}
.tabs.sub2{position:static;background:transparent;padding-block:0}
.fmla{font-size:.8rem;color:var(--chalk-soft)}
.phone .stim q{font-size:1.15rem}
.phone .paper{padding:16px}
.phone .paper h2{font-size:1.8rem}
.phone .big{min-height:90px}
.field .seg{align-self:flex-start}
body{min-height:100vh}

        var b0 = bin.read();

        var b2 = read();

      var bytes = [];

        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);

          }

];
const CARD=Object.fromEntries(CARDS.map(c=>[c.id,c]));

const SIFTDECK=[['pause','Пауза','S',4,'+1 жетон концентрации'],['domain','Проверить домен','I',4,'Перевернуть карточку источника'],['author','Проверить автора','I',3,'Перевернуть карточку источника'],['compare','Сравнить с другими СМИ','F',5,'+2 источника и +2 к лимиту'],['origin','Найти первоисточник','T',2,'Открыть исходный контекст'],['reverse','Обратный поиск изображения','T',2,'Открыть исходный контекст']];
const SIFTINFO=Object.fromEntries(SIFTDECK.map(d=>[d[0],{n:d[1],L:d[2],eff:d[4]}]));
const LCOL={S:'var(--orange)',I:'var(--pink)',F:'var(--violet)',T:'var(--blue)'};

const EVENTS={1:['Информационный шум','Срочный дедлайн: −1 жетон концентрации.'],2:['Атака ботофермы','Ошибка при «Быстром ответе» стоит на 1 репутацию больше.'],3:['Штатный режим','Раунд без особых условий.'],4:['Штатный режим','Раунд без особых условий.'],5:['Инсайдерская наводка','Первая проверка источника бесплатна.'],6:['Редакционный кофе-брейк','+1 жетон концентрации (если запас полон — замена карточки SIFT).']};
const ZONES=[[1,'Сбор информации','',' var(--yellow)'],[2,'Стоп','S','var(--orange)'],[3,'Проверка источника','I','var(--pink)'],[4,'Поиск лучших источников','F','var(--violet)'],[5,'Первоисточник','T','var(--blue)'],[6,'Анализ аргумента','','var(--green)'],[7,'Вердикт','','var(--red)']];
const TEAMDEF=[['Красные','#e2574c'],['Синие','#4f86c6'],['Зелёные','#4f9d63'],['Жёлтые','#e2b33c']];

/* ======================= ПРАВИЛА (общие для браузера и сервера) ======================= */
const rnd=n=>Math.floor(Math.random()*n);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

function makeUnit(name,color){
  const deck=shuffle(SIFTDECK.flatMap(d=>Array(d[3]).fill(d[0])));
  return {name,color,rep:10,conc:5,pts:0,hand:deck.splice(0,3),deck,clues:0,dist:[],log:[],quickStreak:0,out:false,closure:null,turn:null};
}
function caseCard(caseId){return CARDS.find(c=>c.caseId===caseId).id}
function generalCards(n){return shuffle(CARDS.filter(c=>!c.caseId).map(c=>c.id)).slice(0,n)}
function roundCards(caseId){return [caseCard(caseId)].concat(generalCards(4))}

function beginTurn(u,round,roll,cardId){
  if(round>1)u.conc=Math.min(5,u.conc+2);
  while(u.hand.length<3&&u.deck.length)u.hand.push(u.deck.shift());
  let evNote='';
  if(roll===1)u.conc=Math.max(0,u.conc-1);
  if(roll===6){if(u.conc<5)u.conc++;else if(u.deck.length&&u.hand.length){u.deck.push(u.hand.shift());u.hand.push(u.deck.shift());evNote='Карточка SIFT заменена.'}}
  const c=CARD[cardId];
  u.turn={cardId,zone:1,roll,evNote,hyp:null,mode:null,pubFlipped:false,opened:[],limit:3,extras:false,orig:false,
    freeI:roll===5,botfarm:roll===2,placed:{},missing:[],tCheck:null,tShown:false,detect:null,verdict:null,dis:null,shiftLog:[],scale:50,result:null,
    order:c.arg?shuffle(c.arg.fr.map((f,i)=>i)):[]};
  return u.turn;
}
function allSrc(t){const c=CARD[t.cardId];return c.rel.concat(t.extras?c.extra:[])}
function scaleShift(t,s,stance,label){
  const n=shiftOf(s),d=(stance==='for'?1:-1)*n*10,before=t.scale;
  t.scale=Math.max(0,Math.min(100,before+d));
  t.shiftLog.push(label+': '+SRC[s].n+' — Э'+SRC[s].e+' / А'+SRC[s].a+' → N = '+n+', '+(stance==='for'?'подтверждает':'опровергает')+': '+before+'% → '+t.scale+'%');
}
function hasCard(u,L){return u.hand.some(k=>SIFTINFO[k].L===L)}
function useCard(u,L){const i=u.hand.findIndex(k=>SIFTINFO[k].L===L);if(i<0)return null;return u.hand.splice(i,1)[0]}
/* «Адвокат дьявола»: открыт ли хотя бы один источник, противоречащий вердикту */
function opposedOpened(t,v){const all=allSrc(t);const want=v==='true'?'against':'for';return t.opened.some(i=>all[i][1]===want)}
function inGrey(t){return t.scale>20&&t.scale<80}
/* разбор по Тулмину: результат по каждой ячейке */
function toulminRes(t){const a=CARD[t.cardId].arg,res={};
  for(const [k] of SLOTS){const exp=a.missing.includes(k)?'miss':String(a.fr.findIndex(f=>f[1]===k));
    const got=t.missing.includes(k)?'miss':Object.keys(t.placed).find(f=>t.placed[f]===k);res[k]=exp===String(got)}
  return res}
function toulminOk(t){return !!CARD[t.cardId].arg&&!t.tShown&&Object.values(toulminRes(t)).every(Boolean)}
function warnings(t){const w=[];if(t.mode!=='analysis')return w;const cat=t.verdict==='true'||t.verdict==='fake';
  if(cat&&inGrey(t))w.push('Маркер на '+t.scale+'% — в «серой зоне». Категоричный вердикт будет засчитан как поспешный (−1 репутация).');
  if(cat&&!opposedOpened(t,t.verdict))w.push('Адвокат дьявола: вы не открыли ни одного источника, который противоречит вашему вердикту. Будет выдана карточка «Предвзятость подтверждения» (−1 очко).');
  return w}

/* act: изменить ход по действию игрока. Возвращает true, если что-то изменилось. */
function act(u,type,v,ctx){
  const t=u.turn;if(!t||t.result||u.out)return false;const c=CARD[t.cardId];
  switch(type){
    case 'hyp':if(t.zone!==1)return false;t.hyp=v==='true'?'true':'fake';t.zone=2;return true;
    case 'pause':if(t.zone!==2||u.conc>=5)return false;if(!useCard(u,'S'))return false;u.conc++;return true;
    case 'quick':if(t.zone!==2)return false;t.mode='quick';t.zone=7;u.quickStreak++;return true;
    case 'analysis':if(t.zone!==2||u.conc<1)return false;u.conc--;t.mode='analysis';t.zone=3;u.quickStreak=0;return true;
    case 'flipPub':if(t.zone!==3||t.pubFlipped)return false;
      if(v==='free'){if(!t.freeI)return false;t.freeI=false}else if(v==='card'){if(!useCard(u,'I'))return false}else{if(u.conc<1)return false;u.conc--}
      t.pubFlipped=true;scaleShift(t,c.pub,'for','Источник публикации');return true;
    case 'next':if(t.zone<3||t.zone>6)return false;t.zone++;return true;
    case 'openSrc':{if(t.zone!==4)return false;const i=+v,all=allSrc(t);if(!(i>=0&&i<all.length)||t.opened.includes(i)||t.opened.length>=t.limit)return false;
      t.opened.push(i);scaleShift(t,all[i][0],all[i][1],'Источник');return true}
    case 'compare':if(t.zone!==4||t.extras)return false;if(!useCard(u,'F'))return false;t.extras=true;t.limit+=2;return true;
    case 'origin':if(t.zone!==5||t.orig)return false;if(v==='card'){if(!useCard(u,'T'))return false}else{if(u.conc<1)return false;u.conc--}t.orig=true;return true;
    case 'place':{if(t.zone!==6||!c.arg)return false;const ch=+v.chip,k=v.slot;if(!SLOTL[k]||!(ch>=0&&ch<c.arg.fr.length))return false;
      for(const f in t.placed)if(t.placed[f]===k)delete t.placed[f];t.placed[ch]=k;t.missing=t.missing.filter(m=>m!==k);t.tCheck=null;return true}
    case 'clearSlot':{if(t.zone!==6)return false;for(const f in t.placed)if(t.placed[f]===v)delete t.placed[f];t.tCheck=null;return true}
    case 'miss':{if(t.zone!==6||!SLOTL[v])return false;if(t.missing.includes(v))t.missing=t.missing.filter(m=>m!==v);else{t.missing.push(v);for(const f in t.placed)if(t.placed[f]===v)delete t.placed[f]}t.tCheck=null;return true}
    case 'tcheck':if(t.zone!==6||!c.arg)return false;t.tCheck=toulminRes(t);return true;
    case 'tshow':{if(t.zone!==6||!c.arg)return false;t.tShown=true;t.placed={};c.arg.fr.forEach((f,i)=>{t.placed[i]=f[1]});t.missing=c.arg.missing.slice();return act(u,'tcheck')}
    case 'detect':if(t.zone!==6||!DETL[v])return false;t.detect=v;return true;
    case 'verdict':if(t.zone!==7||!VERD[v])return false;t.verdict=v;if(v!=='fake')t.dis=null;return true;
    case 'dis':if(t.zone!==7||t.verdict!=='fake'||(v!=='dis'&&v!=='mis'))return false;t.dis=v;return true;
    case 'lock':if(t.zone!==7||!t.verdict||(t.verdict==='fake'&&!t.dis))return false;finish(u,ctx);return true;
  }
  return false;
}

function finish(u,ctx){
  const t=u.turn,c=CARD[t.cardId],L=[],dists=[];let dp=0,dr=0;
  const v=t.verdict,correct=v===c.verdict;let hasty=false,clue=false;
  if(t.mode==='quick'){
    if(correct){dp+=1;L.push(['+1','Верный вердикт после быстрого ответа','plus'])}
    else{const pen=t.botfarm?3:2;dr-=pen;L.push(['−'+pen+' реп.','Неверный быстрый ответ'+(t.botfarm?' (атака ботофермы)':''),'minus'])}
    if(u.quickStreak>=3&&u.conc>0){dists.push('Предвзятость текущего момента');u.quickStreak=0}
  }else{
    if((v==='true'||v==='fake')&&inGrey(t)){hasty=true;dr-=1;L.push(['−1 реп.','Поспешный вердикт: маркер на '+t.scale+'%, а категоричный ответ разрешён только при ≥80% или ≤20%','minus'])}
    else if(correct){dp+=2;L.push(['+2','Верный вердикт после анализа','plus'])}
    else L.push(['0','Неверный вердикт после анализа','minus']);
    const target=[c.err,c.trap].filter(Boolean);
    if(target.length&&target.includes(t.detect)){dp+=1;L.push(['+1','Верно определено: '+DETL[t.detect],'plus'])}
    if(c.arg){if(toulminOk(t)){dp+=1;L.push(['+1','Аргумент верно разложен по модели Тулмина','plus'])}
      else L.push(['0',t.tShown?'Разбор по Тулмину подсмотрен — бонуса нет':'Разбор по Тулмину неполный или с ошибками','minus'])}
    if((v==='true'||v==='fake')&&!opposedOpened(t,v))dists.push('Предвзятость подтверждения');
  }
  if(c.trap&&!correct)dists.push(TRAPCARD[c.trap]);
  for(const d of dists){dp-=1;L.push(['−1','Карточка искажения: '+d,'minus'])}
  if(correct&&!hasty&&u.clues<5){u.clues++;clue=true}
  u.pts=Math.max(0,u.pts+dp);u.rep=Math.max(0,u.rep+dr);u.dist.push(...dists);
  if(u.rep<=0)u.out=true;
  const all=allSrc(t),disOk=c.dis&&v==='fake'?t.dis===c.dis:null;
  const tul=c.arg&&t.mode==='analysis'?toulminOk(t):null;
  u.log.push({card:c.id,mode:t.mode,hyp:t.hyp,verdict:v,correct,hasty,opened:t.opened.map(i=>all[i][0]),detect:t.detect,tul,disOk,dp,dr});
  t.result={L,correct,hasty,clue,clueText:clue?CASES[ctx.caseId-1].clues[u.clues-1]:null,dists,disOk,dp,dr};
  t.zone=7;
}
function skipTurn(u){const t=u.turn;if(!t||t.result)return;
  t.result={L:[['0','Время вышло: вердикт не вынесен','minus']],correct:false,hasty:false,clue:false,clueText:null,dists:[],disOk:null,skipped:true,dp:0,dr:0};
  u.log.push({card:t.cardId,mode:t.mode||'none',hyp:t.hyp,verdict:null,correct:false,hasty:false,opened:[],detect:null,skipped:true,dp:0,dr:0})}

function unitStats(u){const lg=u.log.filter(l=>!l.skipped);const q=lg.filter(l=>l.mode==='quick'),an=lg.filter(l=>l.mode==='analysis');
  const tf=lg.filter(l=>['true','fake'].includes(CARD[l.card].verdict)&&l.hyp);const cal=tf.filter(l=>l.hyp===CARD[l.card].verdict).length;
  const types={};lg.forEach(l=>l.opened.forEach(s=>{types[SRC[s].t]=(types[SRC[s].t]||0)+1}));
  const top=Object.entries(types).sort((a,b)=>b[1]-a[1]).slice(0,2).map(x=>x[0]);
  const opened=lg.flatMap(l=>l.opened);const avgN=opened.length?opened.reduce((s,x)=>s+shiftOf(x),0)/opened.length:0;
  const tu=lg.filter(l=>l.tul!=null),di=lg.filter(l=>l.disOk!=null);
  return {q:q.length,qc:q.filter(l=>l.correct).length,an:an.length,ac:an.filter(l=>l.correct&&!l.hasty).length,hasty:lg.filter(l=>l.hasty).length,
    cal:tf.length?Math.round(cal/tf.length*100):null,top,avgN,tul:tu.length,tulOk:tu.filter(l=>l.tul).length,dis:di.length,disOk:di.filter(l=>l.disOk).length}}
function solved(u,ctx){const cs=CASES[ctx.caseId-1];return !!(u.closure&&u.closure.org===cs.org&&u.closure.goal===cs.goal)}
function won(u,ctx){return !u.out&&solved(u,ctx)&&u.pts>=ctx.threshold}

const HL={SRC,shiftOf,VERD,DET,DETL,TRAPCARD,SLOTS,SLOTL,CASES,ORGS,GOALS,CARDS,CARD,SIFTDECK,SIFTINFO,LCOL,EVENTS,ZONES,TEAMDEF,
  rnd,shuffle,makeUnit,caseCard,generalCards,roundCards,beginTurn,allSrc,hasCard,opposedOpened,inGrey,toulminRes,toulminOk,warnings,act,finish,skipTurn,unitStats,solved,won};
if(typeof module!=='undefined'&&module.exports)module.exports=HL;else root.HL=HL;
})(typeof window!=='undefined'?window:globalThis);

</script>
<script>
/* ======================= КЛИЕНТ ======================= */
'use strict';
const {SRC,shiftOf,VERD,DET,DETL,SLOTS,SLOTL,CASES,ORGS,GOALS,CARD,SIFTINFO,LCOL,EVENTS,ZONES,TEAMDEF}=HL;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $app=document.getElementById('app');
function lsGet(k){try{const s=localStorage.getItem(k);return s?JSON.parse(s):null}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function lsDel(k){try{localStorage.removeItem(k)}catch(e){}}
const qs=(()=>{try{return new URLSearchParams(location.search)}catch(e){return new URLSearchParams('')}})();

let APP='host';            // host | player | ref
let ONLINE=false;          // доступен ли сервер
let UI={view:null,selChip:null,phoneTab:'rules',tab:'game',link:'',cl:{},busy:false,err:''};
let G=null;                // локальная партия (режим «только ведущий»)
let S=null;                // состояние с сервера
let timeOffset=0;
const LKEY='hamlet21-local-v2';

/* ======================= ОБЩИЕ ЭЛЕМЕНТЫ ======================= */
function qrSVG(text,cell){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:cell||6,margin:2,scalable:true})}catch(e){return ''}}
function dieFaces(n){const map={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};return Array.from({length:9},(_,i)=>`<i style="visibility:${map[n].includes(i)?'visible':'hidden'}"></i>`).join('')}
function stimHTML(cardId){const c=CARD[cardId];return `<div class="stim"><div class="k">Карточка утверждения</div><q>${esc(c.text)}</q><div class="from">Опубликовано: ${esc(SRC[c.pub].n)}</div></div>`}
function scaleHTML(t){return `<div class="scale"><div class="lbl"><span>Фейк ≤20%</span><span>шкала вероятности</span><span>Правда ≥80%</span></div>
  <div class="bar">${[20,40,60,80].map(x=>`<span class="tick" style="left:${x}%"></span>`).join('')}<span class="mk" style="left:${t.scale}%"></span></div>
  <div class="row" style="justify-content:space-between"><span class="val">${t.scale}%</span><span class="fmla">N = max(0, ⌊(Э − А) / 3⌋) делений по 10%</span></div>
  ${t.shiftLog.length?`<div class="log">${t.shiftLog.map(esc).join('<br>')}</div>`:''}</div>`}
function handHTML(u){return `<h3>Рука SIFT-инструментов</h3><div class="hand">${u.hand.length?u.hand.map(k=>{const s=SIFTINFO[k];return `<div class="sift"><span class="L" style="background:${LCOL[s.L]}">${s.L}</span><b>${s.n}</b>${s.eff}</div>`}).join(''):'<span style="color:var(--chalk-soft)">Карточек нет</span>'}</div>`}
function trackHTML(t){const done=!!t.result;return `<div class="track"><h3>Трек расследования</h3>${ZONES.map(([n,nm,L,col])=>{
  const skip=t.mode==='quick'&&n>=3&&n<=6;const cls=done?(skip?'skip':'done'):(n===t.zone?'cur':n<t.zone?(skip?'skip':'done'):'');
  return `<div class="zone ${cls}"><span class="n" style="background:${col}">${n}</span><span>${nm}</span>${L?`<span class="lt">${L}</span>`:''}</div>`}).join('')}
  <div class="note">Событие раунда (D6 = ${t.roll}): <b>${EVENTS[t.roll][0]}</b>. ${EVENTS[t.roll][1]} ${esc(t.evNote||'')}</div></div>`}
const hasCard=(u,L)=>u.hand.some(k=>SIFTINFO[k].L===L);
function allSrc(t){const c=CARD[t.cardId];return c.rel.concat(t.extras?c.extra:[])}

function zoneHTML(u,o){
  const t=u.turn,c=CARD[t.cardId];o=o||{};
  const H=(n,title,hint,body)=>`<div class="paper zonep"><div class="row" style="justify-content:space-between"><h2>${n}. ${title}</h2>${o.who?`<span class="tag" style="background:${ZONES[n-1][3]}">${esc(o.who)}</span>`:''}</div><p class="hint">${hint}</p>${body}</div>`;
  if(t.zone===1)return H(1,'Сбор информации','Прочитайте карточку. До любой проверки зафиксируйте первое впечатление: это нужно для «Зеркала искажений» и разбора в конце.',
    `<div class="row" style="margin-bottom:14px"><div class="die roll" aria-label="Кубик: ${t.roll}">${dieFaces(t.roll)}</div><div><b>Событие раунда: ${EVENTS[t.roll][0]}</b><br>${EVENTS[t.roll][1]} ${esc(t.evNote||'')}</div></div>
    <div class="grid2"><button class="big" data-a="hyp" data-v="true"><span class="ico">✓</span><b>Склоняюсь к правде</b><span>Похоже на правду</span></button><button class="big" data-a="hyp" data-v="fake"><span class="ico">✗</span><b>Склоняюсь к фейку</b><span>Похоже на манипуляцию</span></button></div>`);
  if(t.zone===2)return H(2,'Стоп','Отвечать сразу (Система 1) или тратить концентрацию на проверку (Система 2)? Быстрый ответ бесплатен, но ошибка стоит 2 репутации.',
    `<div class="grid2"><button class="big" data-a="quick"><span class="ico">⚡</span><b>Быстрый ответ</b><span>Зоны 3–6 пропускаются · верно: +1 очко, ошибка: −2 репутации</span></button>
    <button class="big" data-a="analysis" ${u.conc<1?'disabled':''}><span class="ico">🔍</span><b>Анализ</b><span>−1 жетон концентрации · верно: +2 очка${u.conc<1?' · жетонов нет':''}</span></button></div>
    ${hasCard(u,'S')&&u.conc<5?`<p><button class="btn lite" data-a="pause">Сыграть «Пауза» (S): +1 жетон</button></p>`:''}`);
  if(t.zone===3){const s=SRC[c.pub];return H(3,'Проверка источника','Кто опубликовал сообщение? Переверните карточку, чтобы узнать экспертизу (Э) и ангажированность (А).',
    `<div class="srcs"><div class="src ${t.pubFlipped?'open':'back'}"><span class="t">${esc(s.t)}</span><span class="nm">${esc(s.n)}</span>
    ${t.pubFlipped?`<div class="ea"><span>Э ${s.e}/10</span><span>А ${s.a}/10</span></div><span class="sh">Сдвиг шкалы: ${shiftOf(c.pub)} дел. в сторону «правда»</span>`:'<span class="sh" style="color:var(--chalk-soft)">Параметры скрыты</span>'}</div></div>
    <div class="row" style="margin-top:14px">${t.pubFlipped?'':`${t.freeI?`<button class="btn y" data-a="flipPub" data-v="free">Проверить бесплатно (наводка)</button>`:''}${hasCard(u,'I')?`<button class="btn" data-a="flipPub" data-v="card">Сыграть карточку I</button>`:''}<button class="btn" data-a="flipPub" data-v="conc" ${u.conc<1?'disabled':''}>Проверить за 1 жетон</button>`}
    <button class="btn lite" data-a="next">${t.pubFlipped?'Дальше':'Пропустить'} →</button></div>`)}
  if(t.zone===4){const all=allSrc(t);const left=t.limit-t.opened.length;
    return H(4,'Поиск лучших источников',`Позиция источника видна сразу, надёжность — после открытия. Можно открыть ${t.limit} (осталось ${left}). «Адвокат дьявола»: перед вердиктом «Правда» или «Фейк» откройте хотя бы один источник, который ему противоречит.`,
    `<div class="srcs">${all.map(([s,st],i)=>{const op=t.opened.includes(i),S2=SRC[s];return `<div class="src ${op?'open':''}"><span class="t">${esc(S2.t)}</span><span class="nm">${esc(S2.n)}</span><span class="st ${st}">${st==='for'?'подтверждает':'опровергает'}</span>
      ${op?`<div class="ea"><span>Э ${S2.e}</span><span>А ${S2.a}</span><span>N=${shiftOf(s)}</span></div>`:`<div class="act"><button class="btn" data-a="openSrc" data-v="${i}" ${left<1?'disabled':''}>Открыть</button></div>`}</div>`}).join('')}</div>
    <div class="row" style="margin-top:14px">${!t.extras&&hasCard(u,'F')?`<button class="btn" data-a="compare">Сыграть «Сравнить с другими СМИ» (F)</button>`:''}<button class="btn lite" data-a="next">Дальше →</button></div>`)}
  if(t.zone===5)return H(5,'Первоисточник','Найдите исходный контекст: полную цитату, дату съёмки, исходное исследование.',
    t.orig?`<div class="clue" style="background:#e6f0fb">${esc(c.orig)}</div><p><button class="btn lite" data-a="next">Дальше →</button></p>`:
    `<div class="row">${hasCard(u,'T')?`<button class="btn" data-a="origin" data-v="card">Сыграть карточку T</button>`:''}<button class="btn" data-a="origin" data-v="conc" ${u.conc<1?'disabled':''}>Найти за 1 жетон</button><button class="btn lite" data-a="next">Пропустить →</button></div>`);
  if(t.zone===6)return H(6,'Анализ аргумента',c.arg?'Разложите аргумент по модели Тулмина: выберите фрагмент, затем ячейку. Если элемента нет — «нет в тексте». Верный разбор без подсказки: +1 очко. Затем найдите ошибку или ловушку.':'Найдите в карточке логическую ошибку или ловушку-искажение. Верное определение даёт +1 очко.',
    (c.arg?toulminHTML(t):'')+`<h3 class="sub">Детектор ошибок · «Бестиарий»</h3><div class="opts">${DET.map(([id,l])=>`<button class="opt ${t.detect===id?'sel':''}" data-a="detect" data-v="${id}">${l}</button>`).join('')}</div>
    <p style="margin-top:14px"><button class="btn y" data-a="next">К вердикту →</button></p>`);
  if(t.zone===7){const warns=HL.warnings(t);
    return H(7,'Вердикт',t.mode==='quick'?'Быстрый ответ: решайте по первому впечатлению.':'Опирайтесь на шкалу, первоисточник и разбор аргумента. «Мнение» — для оценочных суждений, «Недостаточно данных» — когда доказательств мало.',
    `<div class="verd">${[['true','✓','Правда','v-true'],['fake','✗','Фейк','v-fake'],['opinion','≈','Мнение','v-op'],['insufficient','?','Недостаточно данных','v-ins']].map(([v,i,l,cl])=>`<button class="big ${cl} ${t.verdict===v?'sel':''}" data-a="verdict" data-v="${v}"><span class="ico">${i}</span><b>${l}</b></button>`).join('')}</div>
    ${t.verdict==='fake'?`<p style="margin:14px 0 6px"><b>Ложь распространена намеренно или по ошибке?</b></p><div class="seg"><button class="${t.dis==='dis'?'on':''}" data-a="dis" data-v="dis">Намеренно</button><button class="${t.dis==='mis'?'on':''}" data-a="dis" data-v="mis">По ошибке</button></div>`:''}
    ${warns.map(w=>`<p class="warn">${w}</p>`).join('')}
    <p style="margin-top:14px"><button class="btn y" data-a="lock" ${!t.verdict||(t.verdict==='fake'&&!t.dis)?'disabled':''}>Зафиксировать вердикт</button></p>`)}
  return '';
}
function toulminHTML(t){const a=CARD[t.cardId].arg;const free=t.order.filter(i=>t.placed[i]===undefined);
  let msg='';if(t.tCheck){const ok=Object.values(t.tCheck).filter(Boolean).length;
    msg=ok===6?`<span><b>6 из 6 верно.</b> ${a.missing.length?'Не хватает: '+a.missing.map(m=>SLOTL[m].toLowerCase()).join(', ')+' — аргумент недоказан.':'Все элементы на месте — аргумент прочный.'}</span>`:`<span>${ok} из 6 верно. Исправьте ячейки, отмеченные красным.</span><button class="btn lite" data-a="tshow">Показать верный разбор (без бонуса)</button>`}
  return `<div class="chips">${free.map(i=>`<button class="chip ${UI.selChip===i?'sel':''}" data-a="chip" data-v="${i}">${esc(a.fr[i][0])}</button>`).join('')||'<span style="color:var(--ink-soft)">Все фрагменты разложены</span>'}</div>
  <div class="slots" style="margin-top:12px">${SLOTS.map(([k,l])=>{const f=Object.keys(t.placed).find(x=>t.placed[x]===k);const st=t.tCheck?(t.tCheck[k]?'ok':'bad'):'';
    return `<div class="slot ${st}" role="button" tabindex="0" data-a="slot" data-v="${k}"><div class="h">${l}<button class="miss ${t.missing.includes(k)?'on':''}" data-a="miss" data-v="${k}">нет в тексте</button></div><div class="body">${f!==undefined?esc(a.fr[f][0]):t.missing.includes(k)?'<i>отсутствует</i>':'<span style="color:var(--ink-soft)">пусто</span>'}</div></div>`}).join('')}</div>
  <div class="row" style="margin-top:10px"><button class="btn lite" data-a="tcheck">Проверить разбор</button>${msg}</div>`}

function resultHTML(u,o){const t=u.turn,c=CARD[t.cardId],r=t.result;o=o||{};
  return `<div class="paper"><h2>${r.skipped?'Время вышло':r.hasty?'Поспешный вердикт':r.correct?'Верно!':'Мимо'}</h2>
  <p style="font-size:1.08rem">${r.skipped?'':`Вердикт: <b>${VERD[t.verdict]}</b> · `}верный ответ: <b>${VERD[c.verdict]}</b></p>
  <p>${esc(c.expl)}</p>
  ${t.mode!=='analysis'||!t.orig?`<p class="hint">Первоисточник: ${esc(c.orig)}</p>`:''}
  ${c.err||c.trap?`<p class="hint">В карточке: <b>${[c.err,c.trap].filter(Boolean).map(x=>DETL[x]).join('; ')}</b>${t.mode==='analysis'?` · отмечено: ${t.detect?DETL[t.detect]:'ничего'}`:''}</p>`:''}
  ${r.disOk!==null&&r.disOk!==undefined?`<p class="hint">Это ${c.dis==='dis'?'дезинформация (намеренная ложь)':'мисинформация (ложь по незнанию)'} — ${r.disOk?'определено верно':'ответ был другим'}.</p>`:''}
  <div class="res">${r.L.map(([d,txt,cl])=>`<div class="line"><span class="d ${cl}">${d}</span><span>${esc(txt)}</span></div>`).join('')}</div>
  ${r.clue?`<div class="clue" style="margin-top:12px"><b>Улика ${u.clues}/5 к делу:</b> ${esc(r.clueText)}</div>`:''}
  ${r.dists.map(d=>`<div class="dist" style="margin-top:8px"><b>Карточка искажения:</b> ${esc(d)}</div>`).join('')}
  ${u.out?`<p class="warn" style="margin-top:12px"><b>Банкротство доверия.</b> Репутация упала до 0 — дальше без вас. Разбор будет в конце.</p>`:''}
  ${o.footer||''}</div>`}

function debriefHTML(u,st,title,badge,o){o=o||{};return `<div class="paper"><div class="row" style="justify-content:space-between"><h2 style="font-size:1.8rem">${esc(title)}</h2>${badge||''}</div>
  <div class="kv" style="margin:10px 0"><span>Быстрых ответов / из них верных</span><span>${st.q} / ${st.qc}</span><span>Анализов / верных вердиктов</span><span>${st.an} / ${st.ac}</span><span>Поспешных вердиктов</span><span>${st.hasty}</span><span>Первое впечатление совпало с ответом</span><span>${st.cal===null?'—':st.cal+'%'}</span><span>Средняя надёжность открытых источников (N)</span><span>${st.avgN.toFixed(1)}</span><span>Разбор по Тулмину верно / всего</span><span>${st.tul?st.tulOk+' / '+st.tul:'—'}</span><span>Дезинформация или мисинформация: верно / всего</span><span>${st.dis?st.disOk+' / '+st.dis:'—'}</span></div>
  <p>Чаще всего доверяли: <b>${st.top.length?esc(st.top.join(', ')):'источники не открывались'}</b></p>
  <p>Карточки искажений: ${(u.dist||[]).length?u.dist.map(d=>`<span class="tag" style="background:var(--pink);margin:2px">${esc(d)}</span>`).join(''):'нет'}</p>
  ${o.refl?`<label class="field">В каком раунде вы поторопились с вердиктом и почему? Сформулируйте одно правило проверки для следующей партии.<textarea rows="3" id="refl-${o.refl}" data-refl="${o.refl}">${esc(lsGet('hamlet21-refl-'+o.refl)||'')}</textarea></label>`:''}</div>`}

function statsChips(u,threshold){return `<div class="stats-row"><span title="Очки">★ <b>${u.pts}</b>/${threshold}</span><span title="Репутация">♥ <b>${u.rep}</b></span><span title="Концентрация">◉ <b>${u.conc}</b></span><span title="Улики">🔍 <b>${u.clues}</b>/5</span></div>`}

/* ======================= ВЕРХНЯЯ ПАНЕЛЬ ======================= */
function topBar(extra){return `<div class="top"><div class="brand"><h1><span>Гамлет XXI века</span></h1><small>тренажёр критического мышления</small></div><div class="spacer"></div>${extra||''}
 <button class="ghost" data-a="rules">Правила</button>${(G||S)&&APP==='host'?'<button class="ghost" data-a="confirmNew">Новая игра</button>':''}</div>`}

/* ======================= СТАРТОВЫЙ ЭКРАН ======================= */
let SET={mode:'local',n:3,threshold:10,caseId:0,names:TEAMDEF.map(t=>t[0])};
function setupHTML(){
  const hostSaved=lsGet('hamlet21-host');
  const modes=[['local','Только ведущий','Команды обсуждают вслух, кнопки нажимает ведущий. Команды ходят по очереди, у каждой свои карточки. Работает без сервера.',false],
    ['solo','Ведущий + индивидуально','Каждый играет со своего телефона: все получают одну карточку раунда. На проекторе — прогресс, ответы и таблица лидеров.',!ONLINE],
    ['teams','Ведущий + команды','2–4 команды. Участники заходят с телефонов в свою команду, капитан принимает решения, остальные видят экран команды.',!ONLINE]];
  const showNames=SET.mode!=='solo';const nMin=SET.mode==='teams'?2:1;if(SET.n<nMin)SET.n=nMin;
  return topBar()+`<div class="setup"><div class="paper"><h2>Новая партия</h2>
  <p>Игрок — медиадетектив Новограда. За 5 раундов нужно проверить 5 сообщений и собрать улики, чтобы разоблачить дезинформационную кампанию.</p>
  <div class="modes">${modes.map(([k,t,d,dis])=>`<button class="big mode ${SET.mode===k?'sel':''}" data-a="setMode" data-v="${k}" ${dis?'disabled':''}><b>${t}</b><span>${d}</span>${dis?'<span class="need">Нужен запуск на вашем сервере (server.js)</span>':''}</button>`).join('')}</div>
  ${showNames?`<div class="field" style="margin:14px 0 8px"><span>Количество команд</span><div class="seg">${[1,2,3,4].filter(n=>n>=nMin).map(n=>`<button class="${SET.n===n?'on':''}" data-a="setN" data-v="${n}">${n}</button>`).join('')}</div></div>

function refQR(){

/* ======================= РЕЖИМ «ТОЛЬКО ВЕДУЩИЙ» ======================= */
function lsave(){lsSet(LKEY,G)}
function localNew(){
  const caseId=SET.caseId||1+HL.rnd(5);const general=HL.shuffle(HL.CARDS.filter(c=>!c.caseId).map(c=>c.id));const cc=HL.caseCard(caseId);
  const teams=Array.from({length:SET.n},(_,i)=>{const u=HL.makeUnit(SET.names[i]||TEAMDEF[i][0],TEAMDEF[i][1]);u.cards=HL.shuffle([cc,...general.splice(0,4)]);return u});
  G={cfg:{caseId,threshold:SET.threshold},teams,round:1,turnTeam:0,phase:'turnStart',closureIdx:-1};lsave();
}
const LT=()=>G.teams[G.turnTeam];
function localStartTurn(){const u=LT();HL.beginTurn(u,G.round,1+HL.rnd(6),u.cards[G.round-1]);G.phase='zone';lsave()}
function localAdvance(){let i=G.turnTeam+1;while(i<G.teams.length&&G.teams[i].out)i++;
  if(i<G.teams.length){G.turnTeam=i;G.phase='turnStart'}else{G.round++;const al=G.teams.map((t,k)=>k).filter(k=>!G.teams[k].out);
    if(G.round>5||!al.length){G.closureIdx=-1;localNextClosure();return}G.turnTeam=al[0];G.phase='turnStart'}lsave()}
function localNextClosure(){let i=G.closureIdx+1;while(i<G.teams.length&&G.teams[i].out)i++;if(i<G.teams.length){G.closureIdx=i;G.phase='closure'}else G.phase='final';UI.cl={};lsave()}
function teamChipsLocal(){return `<div class="teams">${G.teams.map((t,i)=>`<div class="team ${G.phase!=='final'&&G.phase!=='closure'&&i===G.turnTeam?'on':''} ${t.out?'out':''}">
  <span class="dot" style="background:${t.color}"></span><b>${esc(t.name)}${t.out?' · выбыла':''}</b>${statsChips(t,G.cfg.threshold)}</div>`).join('')}</div>`}
function localHTML(){
  const cs=CASES[G.cfg.caseId-1];
  const head=topBar(`<span class="pill">Дело ${cs.name}</span>${G.phase==='final'||G.phase==='closure'?'':`<span class="pill">Раунд <b class="mono">${Math.min(G.round,5)}/5</b></span>`}`)+teamChipsLocal();
  if(G.phase==='turnStart'){const u=LT();return head+`<div class="center"><div class="paper narrow cen"><span class="tag" style="background:${u.color};color:#fff">${esc(u.name)}</span><h2>Раунд ${G.round} из 5</h2>
    <p>В начале хода: ${G.round>1?'+2 жетона концентрации (не больше 5), ':''}добор SIFT-карточек до трёх и бросок кубика случайного события.</p><button class="btn y" data-a="lStartTurn">Бросить кубик и начать ход</button></div></div>`}
  if(G.phase==='closure')return head+closureHTML(G.teams[G.closureIdx],G.cfg,'lClose');
  if(G.phase==='final')return head+localFinalHTML();
  const u=LT();
  return head+`<div class="board">${trackHTML(u.turn)}<div class="work">${G.phase==='result'||u.turn.result?resultHTML(u,{footer:`<p style="margin-top:16px"><button class="btn y" data-a="lNext">Передать ход →</button></p>`}):zoneHTML(u,{who:'ход: '+u.name})}</div><div class="side">${stimHTML(u.turn.cardId)}${scaleHTML(u.turn)}<div>${handHTML(u)}</div></div></div>`;
}
function closureHTML(u,cfg,act,o){o=o||{};const cs=CASES[cfg.caseId-1];const cl=UI.cl;const ro=o.readonly;
  return `<div class="paper wide"><div class="row" style="justify-content:space-between"><h2>Закрытие Дела ${cs.name}</h2><span class="tag" style="background:${u.color};color:#fff">${esc(u.name)}</span></div>
  <p class="hint">Сопоставьте открытые улики и назовите организатора кампании и её цель. Без верного ответа победа невозможна.</p>
  <div class="grid2" style="margin:12px 0">${cs.clues.slice(0,u.clues).map((c,i)=>`<div class="clue"><b>Улика ${i+1}.</b> ${esc(c)}</div>`).join('')||'<p>Не открыто ни одной улики.</p>'}</div>
  <h3 class="sub">Организатор</h3><div class="opts">${ORGS.map((x,i)=>`<button class="opt ${cl.org===i?'sel':''}" data-a="clSel" data-f="org" data-v="${i}" ${ro?'disabled':''}>${esc(x)}</button>`).join('')}</div>
  <h3 class="sub">Цель</h3><div class="opts">${GOALS.map((x,i)=>`<button class="opt ${cl.goal===i?'sel':''}" data-a="clSel" data-f="goal" data-v="${i}" ${ro?'disabled':''}>${esc(x)}</button>`).join('')}</div>
  <p style="margin-top:14px"><button class="btn y" data-a="${act}" ${cl.org==null||cl.goal==null||ro?'disabled':''}>Закрыть дело</button></p></div>`}
function localFinalHTML(){const cs=CASES[G.cfg.caseId-1];const ctx=G.cfg;
  const rows=G.teams.map((u,i)=>({u,i,solved:HL.solved(u,ctx),win:HL.won(u,ctx)})).sort((a,b)=>b.u.pts-a.u.pts||b.u.rep-a.u.rep);
  return `<div class="paper"><h2>Итоги партии</h2><p>Дело ${cs.name}: организатор — <b>${esc(ORGS[cs.org])}</b>, цель — <b>${esc(GOALS[cs.goal])}</b>.</p>${standingsTable(rows.map(r=>({name:r.u.name,color:r.u.color,pts:r.u.pts,rep:r.u.rep,clues:r.u.clues,out:r.u.out,solved:r.solved,won:r.win})),G.cfg.threshold)}</div>
  <h2 class="onfelt">Дебрифинг</h2><div class="debrief">${G.teams.map((u,i)=>debriefHTML(u,HL.unitStats(u),u.name,`<span class="tag" style="background:${u.color};color:#fff">${HL.won(u,ctx)?'победа':'разбор'}</span>`,{refl:'local'+i})).join('')}</div>
  <p><button class="btn y" data-a="newgame">Новая игра</button></p>`}
function standingsTable(rows,thr){return `<div class="tblwrap"><table class="lb"><thead><tr><th class="num">#</th><th>Участник</th><th class="num">Очки</th><th class="num">Репутация</th><th class="num">Улики</th><th>Дело</th><th>Итог</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr><td class="num">${i+1}</td><td><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</td><td class="num">${r.pts}/${thr}</td><td class="num">${r.rep}</td><td class="num">${r.clues}/5</td><td>${r.out?'—':r.solved?'раскрыто':'нет'}</td><td class="${r.won?'win':'lose'}">${r.won?'Победа':r.out?'Банкротство доверия':'Поражение'}</td></tr>`).join('')}</tbody></table></div>`}

let ES=null;
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});
  const j=await r.json().catch(()=>({error:'Сервер не ответил'}));if(!r.ok)throw new Error(j.error||'Ошибка');return j}
function connect(params){if(ES)ES.close();
  ES=new EventSource('/api/stream?'+new URLSearchParams(params).toString());
  ES.onmessage=e=>{try{S=JSON.parse(e.data);timeOffset=S.now-Date.now();UI.conn=true;render()}catch(err){}};
  ES.onerror=()=>{UI.conn=false;renderConn()};
}
// плашка «нет связи» — только после реального обрыва потока, а не до первого подключения
function renderConn(){const el=document.getElementById('conn');if(el)el.hidden=UI.conn!==false}
function hostCreds(){return lsGet('hamlet21-host')}
function hostAct(type,v){const h=hostCreds();if(!h)return;api('/api/act',{room:h.code,role:'host',key:h.key,type,v}).catch(e=>{UI.err=e.message;render()})}
function playerCreds(){return lsGet('hamlet21-player-'+(qs.get('room')||'').toUpperCase())}
function playerAct(type,v){const p=playerCreds();if(!p)return;api('/api/act',{room:qs.get('room'),role:'player',pid:p.pid,key:p.key,type,v}).catch(()=>{})}
setInterval(()=>{const el=document.querySelectorAll('[data-timer]');if(!el.length)return;el.forEach(x=>{x.textContent=timerText()})},500);
function timerText(){if(!S||!S.timerEnd)return '';const ms=S.timerEnd-(Date.now()+timeOffset);if(ms<=0)return '0:00';const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

function joinUrl(){return location.origin+location.pathname+'?room='+S.code}
function hostHTML(){
  const cs=CASES[S.cfg.caseId-1];
  const head=topBar(`<span class="pill">${S.mode==='teams'?'Команды':'Индивидуально'} · комната <b class="mono">${S.code}</b></span><span class="pill">Дело ${cs.name}</span>${S.round&&S.phase!=='final'&&S.phase!=='closure'?`<span class="pill">Раунд <b class="mono">${S.round}/5</b></span>`:''}`)+`<div id="conn" class="warn" hidden>Нет связи с сервером — переподключаюсь…</div>`;

    const list=S.mode==='teams'?`<div class="teamcols">${S.units.map(u=>`<div class="paper tcol"><h3 style="font-size:1.6rem"><span class="sw" style="background:${u.color}"></span>${esc(u.name)}</h3><p class="small">${u.members.length?u.members.map(esc).join(', '):'пока никого'}</p></div>`).join('')}</div>`

    <div class="paper"><h2>Подключились: ${S.players}</h2>${list}<p class="hint" style="margin-top:12px">${S.mode==='teams'?'Первый вошедший в команду становится капитаном: он нажимает кнопки, остальные видят экран команды. Капитана можно сменить с телефона.':'Каждый играет сам за себя. Опоздавшие могут зайти в любой момент — они начнут с текущего раунда.'}</p>
    <p style="margin-top:14px"><button class="btn y" data-a="hStart" ${S.players<1?'disabled':''}>Начать игру</button></p></div></div>`}
  if(S.phase==='play'){const done=S.units.filter(u=>u.done||u.out).length,act=S.units.filter(u=>!u.out).length;
    return head+`<div class="proj"><div class="projmain">${stimHTML(S.cardId)}
      <div class="paper"><div class="row" style="justify-content:space-between"><h2>Раунд ${S.round}: идёт проверка</h2><span class="timer mono" data-timer>${timerText()}</span></div>
      <div class="row" style="margin:8px 0 12px"><div class="die" aria-label="Кубик">${dieFaces(S.roll)}</div><div><b>Событие раунда: ${EVENTS[S.roll][0]}</b><br>${EVENTS[S.roll][1]}</div></div>
      <p>Готово: <b class="mono">${done} из ${S.units.length}</b>${S.units.length!==act?` (выбыли: ${S.units.length-act})`:''}</p>
      <div class="prog">${S.units.map(u=>`<div class="pu ${u.done?'ok':''} ${u.out?'out':''}" style="border-color:${u.color}"><span>${esc(u.name)}</span><b class="mono">${u.out?'выбыл':u.done?'✓':'зона '+u.zone}</b></div>`).join('')}</div>
      <div class="row" style="margin-top:14px"><button class="btn y" data-a="hReveal">Показать ответы</button><button class="btn lite" data-a="hTimer" data-v="90">Таймер 1:30</button><button class="btn lite" data-a="hTimer" data-v="180">3:00</button><button class="btn lite" data-a="hTimer" data-v="0">Стоп</button></div></div></div>
      <div class="side"><div class="paper cen small-qr"><p class="small">Опоздавшим</p><div class="qr">${qrSVG(joinUrl(),4)}</div><p class="mono small">${S.code}</p></div></div></div>`}
  if(S.phase==='reveal'){const c=CARD[S.cardId];const ans=S.units.filter(u=>u.verdict);const cnt=v=>ans.filter(u=>u.verdict===v).length;
    const q=ans.filter(u=>u.mode==='quick'),a=ans.filter(u=>u.mode==='analysis');const okq=q.filter(u=>u.verdict===c.verdict).length,oka=a.filter(u=>u.verdict===c.verdict).length;
    const rows=S.units.slice().sort((x,y)=>y.pts-x.pts);
    return head+`<div class="proj"><div class="projmain">${stimHTML(S.cardId)}<div class="paper"><h2>Верный ответ: ${VERD[c.verdict]}</h2><p style="font-size:1.1rem">${esc(c.expl)}</p><p class="hint">Первоисточник: ${esc(c.orig)}</p>
      ${c.err||c.trap?`<p class="hint">В карточке: <b>${[c.err,c.trap].filter(Boolean).map(x=>DETL[x]).join('; ')}</b></p>`:''}
      <h3 class="sub">Как ответили</h3><div class="dist-bars">${Object.keys(VERD).map(v=>{const n=cnt(v),pct=ans.length?Math.round(n/ans.length*100):0;return `<div class="db ${v===c.verdict?'right':''}"><span>${VERD[v]}</span><div class="dbar"><i style="width:${pct}%"></i></div><b class="mono">${n}</b></div>`}).join('')}</div>

  if(S.phase==='final'){const rows=S.units.slice().sort((a,b)=>b.pts-a.pts||b.rep-a.rep);
    const sts=S.units.map(u=>u.stats).filter(Boolean);const sum=k=>sts.reduce((s,x)=>s+x[k],0);

      <p style="margin-top:10px">Самые частые искажения: ${topD.length?topD.map(([d,n])=>`<span class="tag" style="background:var(--pink);margin:2px">${esc(d)} · ${n}</span>`).join(''):'нет'}</p></div>

    return `<div class="phone">${head}<div class="paper"><h2>Вход в игру</h2><p>Комната <b class="mono">${esc(ROOMINFO.code)}</b> · ${ROOMINFO.mode==='teams'?'игра командами':'каждый за себя'}</p>
      <label class="field"><span>Ваше имя</span><input id="pname" data-pname maxlength="20" value="${esc(UI.pname||'')}" autocomplete="nickname"></label>
      ${ROOMINFO.mode==='teams'?`<p style="margin:12px 0 6px"><b>Ваша команда</b></p><div class="opts">${ROOMINFO.teams.map(t=>`<button class="opt ${UI.team===t.uid?'sel':''}" data-a="pteam" data-v="${t.uid}"><span class="sw" style="background:${t.color}"></span>${esc(t.name)} <small>(${t.members})</small></button>`).join('')}</div>`:''}
      ${UI.err?`<p class="warn">${esc(UI.err)}</p>`:''}
      <p style="margin-top:14px"><button class="btn y" data-a="pjoin" ${UI.busy?'disabled':''}>Войти</button></p></div></div>`}
  if(!S)return `<div class="phone">${head}<div class="paper"><p>Подключаюсь…</p></div></div>`;
  if(UI.tab==='ref')return `<div class="phone">${head}${tabs}${refBody()}</div>`;
  const u=S.unit,me=S.me,ro=!me.captain;
  const who=`<div class="paper meline"><div class="row" style="justify-content:space-between"><b><span class="sw" style="background:${u.color}"></span>${esc(S.mode==='teams'?u.name:me.name)}</b>${S.timerEnd?`<span class="timer mono" data-timer>${timerText()}</span>`:''}</div>${statsChips(u,S.cfg.threshold)}
    ${S.mode==='teams'?`<p class="small">${ro?`Решения принимает капитан: <b>${esc(S.captainName||'—')}</b>. <button class="linkbtn" data-a="pcaptain">Стать капитаном</button>`:'Вы капитан команды: нажимайте кнопки после обсуждения.'}</p>`:''}</div>`;
  let body='';
  if(S.phase==='lobby')body=`<div class="paper"><h2>Вы в игре</h2><p>${S.mode==='teams'?`Команда «${esc(u.name)}»: ${S.members.map(esc).join(', ')}`:'Ждём, пока ведущий начнёт игру.'}</p><p class="hint">Пока ждёте, загляните во вкладку «Справочник».</p></div>`;
  else if(S.phase==='play'){
    if(u.out)body=`<div class="paper"><h2>Банкротство доверия</h2><p>Репутация упала до 0. Следите за обсуждением — разбор будет в конце.</p></div>`;
    else if(!u.turn)body=`<div class="paper"><p>Вы присоединились во время раунда. Ваша игра начнётся со следующего раунда.</p></div>`;
    else if(u.turn.result)body=resultHTML(u,{footer:`<p class="hint" style="margin-top:12px">Ждём остальных. Ответы откроет ведущий.</p>`});
    else body=stimHTML(u.turn.cardId)+`<div class="work${ro?' ro':''}">${zoneHTML(u)}</div>`+(u.turn.mode==='analysis'?scaleHTML(u.turn):'')+`<div>${handHTML(u)}</div>`;
  }
  else if(S.phase==='reveal'){body=(u.turn&&u.turn.result?resultHTML(u):'<div class="paper"><p>В этом раунде вы не играли.</p></div>')+standingsMini()}
  else if(S.phase==='closure'){
    if(u.out)body=`<div class="paper"><p>Команда выбыла. Ждём итогов.</p></div>`;
    else if(u.closure&&u.closure.done)body=`<div class="paper"><h2>Ответ принят</h2><p>Организатор: <b>${esc(ORGS[u.closure.org])}</b><br>Цель: <b>${esc(GOALS[u.closure.goal])}</b></p><p class="hint">Ждём итогов на общем экране.</p></div>`;
    else body=`<div class="${ro?'ro':''}">${closureHTML(u,S.cfg,'pClose',{readonly:ro})}</div>`;
  }
  else if(S.phase==='final'){body=`<div class="paper cen"><h2>${S.won?'Победа!':'Партия окончена'}</h2><p>${S.solved?'Дело раскрыто.':'Дело не раскрыто.'} Очков: <b>${u.pts}</b> из ${S.cfg.threshold} нужных, репутация: <b>${u.rep}</b>.</p></div>`+debriefHTML(u,HL.unitStats(u),'Ваш дебрифинг','',{refl:S.code+me.pid})+standingsMini()}
  return `<div class="phone">${head}${tabs}${who}${body}</div>`;
}
function standingsMini(){if(!S.standings)return '';return `<div class="paper"><h3 class="sub" style="margin-top:0">Таблица лидеров</h3><table class="lb compact"><tbody>${S.standings.map((r,i)=>`<tr><td class="num">${i+1}</td><td><span class="sw" style="background:${r.color}"></span>${esc(r.name)}</td><td class="num">${r.pts}</td></tr>`).join('')}</tbody></table></div>`}

/* ======================= ОТРИСОВКА ======================= */
function render(){
  if(APP==='ref'){$app.innerHTML=refPage();return}
  if(UI.view==='rules'){$app.innerHTML=topBar()+`<div class="paper">${rulesHTML()}<p><button class="btn" data-a="rules">Назад</button></p></div>`;return}
  if(APP==='player'){$app.innerHTML=playerHTML();postRender();return}
  if(UI.view==='confirm'){$app.innerHTML=topBar()+`<div class="center"><div class="paper narrow"><h2>Начать новую игру?</h2><p>Текущая партия будет закрыта.</p><div class="row"><button class="btn" data-a="newgame">Да, новая игра</button><button class="btn lite" data-a="back">Продолжить</button></div></div></div>`;return}
  if(S&&UI.online){$app.innerHTML=hostHTML();renderConn();return}
  if(G){$app.innerHTML=localHTML();return}
  $app.innerHTML=setupHTML();
}
function postRender(){renderConn();if(APP==='player'&&S&&S.mode==='teams'&&!S.me.captain){document.querySelectorAll('.ro [data-a]').forEach(b=>{b.disabled=true;b.setAttribute('aria-disabled','true')})}}

/* ======================= СПРАВОЧНИК ======================= */
function refBody(){const tab=UI.phoneTab;const tabs=[['rules','Правила'],['sift','SIFT и шкала'],['best','Бестиарий'],['bias','Искажения'],['journal','Журнал']];
  return `<div class="tabs sub2">${tabs.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="ptab" data-v="${k}">${l}</button>`).join('')}</div><div class="paper">${refContent(tab)}</div>`}
function refPage(){return `<div class="phone"><div class="brand"><h1 style="font-size:2rem;color:var(--paper)"><span>Гамлет XXI века</span></h1></div><small style="color:var(--chalk-soft)">Справочник детектива · игра идёт на общем экране</small>${refBody()}</div>`}

function rulesHTML(full){return `<h2>Как играть</h2><ol class="rules">
<li><b>Цель.</b> За 5 раундов набрать порог очков, сохранить репутацию выше 0 и в финале назвать организатора и цель кампании из Дела.</li>
<li><b>Старт:</b> репутация 10, концентрация 5 жетонов, 3 SIFT-карточки. С каждым раундом +2 жетона (не больше 5).</li>
<li><b>Ход — круг по 7 зонам.</b> 1 — первое впечатление; 2 — «Стоп»: быстрый ответ (бесплатно, сразу к вердикту) или анализ (−1 жетон); 3–5 — шаги SIFT: проверить источник, найти лучшие источники, найти первоисточник; 6 — разбор аргумента и поиск ошибки; 7 — вердикт.</li>
<li><b>Шкала вероятности</b> стартует с 50%. Каждый открытый источник сдвигает её на N = max(0, ⌊(Э − А) / 3⌋) делений по 10%.</li>
<li><b>Очки:</b> верный быстрый ответ +1, верный вердикт после анализа +2, найденная ошибка +1, верный разбор по Тулмину +1. Неверный быстрый ответ −2 репутации.</li>
<li><b>Порог доказанности:</b> «Правда» — только при ≥80%, «Фейк» — только при ≤20%. В «серой зоне» категоричный вердикт — поспешный (−1 репутация). Честный ответ там — «Недостаточно данных».</li>
<li><b>Адвокат дьявола:</b> перед вердиктом «Правда» или «Фейк» откройте хотя бы один источник, который ему противоречит, иначе — карточка «Предвзятость подтверждения» (−1 очко). Бесплатно можно открыть 3 источника.</li>
<li><b>Мнение</b> нельзя назвать правдой или фейком — для оценочных суждений есть вердикт «Мнение».</li>
<li><b>Улики:</b> за каждый верный вердикт открывается улика к Делу. Репутация 0 — досрочное поражение.</li></ol>`}
const BEST=[['Ad Hominem','Нападение на человека вместо аргумента'],['Соломенное чучело','Искажение позиции оппонента'],['Post hoc','«После этого — значит вследствие этого»'],['Ложная дилемма','Искусственный выбор из двух вариантов'],['Апелляция к большинству','«Так думают все»'],['Апелляция к авторитету','Ссылка на авторитет вне его области'],['Корреляция ≠ причинность','Совместное изменение выдаётся за причину'],['Скользкий склон','Цепочка недоказанных последствий'],['Поспешное обобщение','Вывод по единичным случаям'],['Апелляция к эмоциям','Страх или жалость вместо доводов'],['Отвлекающий манёвр','Подмена предмета спора'],['Круговое рассуждение','Вывод уже заложен в посылке'],['«Сам такой»','Ответ встречным обвинением'],['Апелляция к природе','«Натуральное — значит хорошее»'],['Апелляция к традиции','«Всегда так делали»'],['Подтасовка фактов','Выбор только удобных данных'],['Ложная аналогия','Сравнение несопоставимого'],['Вопрос с подвохом','Скрытая ложная предпосылка'],['«Настоящий шотландец»','Подгонка определения под вывод'],['Аргумент к незнанию','«Не доказано обратное — значит, верно»']];
const BIAS=[['Предвзятость подтверждения','Ищем только подтверждения своей версии'],['Эффект якоря','Первое число задаёт точку отсчёта'],['Ошибка доступности','Яркий пример кажется частым'],['Ошибка выжившего','Видим только успешные случаи'],['Предвзятость текущего момента','Быстрая выгода сейчас важнее'],['Эффект ореола','Солидный вид — значит, надёжно'],['Иллюзия правды','Повторяемое кажется истинным'],['Присоединение к большинству','Следуем за толпой'],['Эффект фрейминга','Решение зависит от формулировки'],['Пренебрежение базовой частотой','Игнорируем общую статистику'],['Излишняя уверенность','Переоцениваем точность суждений'],['Негативная предвзятость','Плохие новости кажутся достовернее'],['Эффект авторитета','Доверяем статусу, а не доводам'],['Кластерная иллюзия','Видим закономерность в случайном'],['Эффект недавнего','Последняя информация перевешивает']];
function jget(){try{return JSON.parse(localStorage.getItem('hamlet21-journal')||'{}')}catch(e){return {}}}
function jset(o){try{localStorage.setItem('hamlet21-journal',JSON.stringify(o))}catch(e){}}
function refContent(tab){const J=jget();
  let body='';
  if(tab==='rules')body=rulesHTML();
  if(tab==='sift')body=`<h2>SIFT — четыре шага</h2><div class="entry"><b>S — Stop (Стоп)</b><small>Не реагируйте сразу. Что во мне вызывает эта новость?</small></div><div class="entry"><b>I — Investigate the source</b><small>Кто автор? Какая у него экспертиза и заинтересованность?</small></div><div class="entry"><b>F — Find better coverage</b><small>Что пишут надёжные источники? Есть ли опровержения?</small></div><div class="entry"><b>T — Trace claims</b><small>Найдите первоисточник: полную цитату, дату, исходное исследование.</small></div>
  <h2 style="margin-top:14px">Шкала вероятности</h2><p>Старт 50%. Сдвиг: <b class="mono">N = max(0, ⌊(Э − А) / 3⌋)</b> делений по 10% — к «правде», если источник подтверждает, к «фейку», если опровергает.</p><div class="entry"><b>Пример</b><small>Фактчекер Э8/А2 → N = 2 (±20%). Анонимный канал Э2/А8 → N = 0, шкала не сдвигается.</small></div>
  <h2 style="margin-top:14px">Вердикты</h2><div class="entry"><b>Правда / Фейк</b><small>Только при ≥80% / ≤20%.</small></div><div class="entry"><b>Мнение</b><small>Оценочное суждение: проверяют обоснованность, а не истинность.</small></div><div class="entry"><b>Недостаточно данных</b><small>Честный ответ, когда маркер в «серой зоне».</small></div>`;
  if(tab==='best')body=`<h2>Бестиарий ошибок</h2>`+BEST.map(([a,b],i)=>`<div class="entry"><b>${i+1}. ${a}</b><small>${b}</small></div>`).join('');
  if(tab==='bias')body=`<h2>Когнитивные искажения</h2>`+BIAS.map(([a,b],i)=>`<div class="entry"><b>${i+1}. ${a}</b><small>${b}</small></div>`).join('');
  if(tab==='journal')body=`<h2>Журнал детектива</h2><p style="font-size:.9rem;color:var(--ink-soft)">Записи хранятся только на этом телефоне. Сравните их с дебрифингом в конце.</p>
   <div class="jr" style="font-weight:600;margin:8px 0"><span>Р.</span><span>Впечатление</span><span>Режим</span><span>Вердикт</span></div>
   ${[1,2,3,4,5].map(r=>{const e=J[r]||{};const sel=(f,opts)=>`<select id="j${r}${f}" data-j="${r}" data-f="${f}"><option value=""></option>${opts.map(o=>`<option ${e[f]===o?'selected':''}>${o}</option>`).join('')}</select>`;
     return `<div class="jr" style="margin-bottom:6px"><span class="mono">${r}</span>${sel('h',['Правда','Фейк'])}${sel('m',['Быстро','Анализ'])}${sel('v',['Правда','Фейк','Мнение','Нед. данных'])}</div>`}).join('')}
   <label class="field" style="margin-top:10px">Моё правило проверки на следующую партию<textarea id="jnote" rows="3" data-jnote>${esc(J.note||'')}</textarea></label>`;
  return body}

/* ======================= СОБЫТИЯ ======================= */
const GAME_ACTS=new Set(['hyp','pause','quick','analysis','flipPub','next','openSrc','compare','origin','miss','tcheck','tshow','detect','verdict','dis','lock']);
function dispatchGame(type,v){
  if(APP==='player'){playerAct(type,v);return}
  if(!G)return;const u=LT();
  if(HL.act(u,type,v,G.cfg)){if(type==='lock')G.phase='result';lsave()}
  render();
}
function readNames(){SET.names=SET.names.map((n,i)=>{const el=document.getElementById('tn'+i);return el?(el.value.trim()||TEAMDEF[i][0]):n})}
function resetAll(){if(ES){ES.close();ES=null}S=null;UI.online=false;G=null;lsDel(LKEY);lsDel('hamlet21-host');UI.view=null;UI.err='';UI.cl={}}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='miss')e.stopPropagation();
  if(GAME_ACTS.has(a)){dispatchGame(a,a==='openSrc'?+v:v);return}
  switch(a){
    case 'chip':UI.selChip=UI.selChip===+v?null:+v;render();return;
    case 'slot':if(UI.selChip!==null){const ch=UI.selChip;UI.selChip=null;dispatchGame('place',{chip:ch,slot:v})}else dispatchGame('clearSlot',v);return;
    case 'rules':UI.view=UI.view==='rules'?null:'rules';render();return;
    case 'back':UI.view=null;render();return;
    case 'confirmNew':UI.view='confirm';render();return;
    case 'newgame':resetAll();render();return;
    case 'ptab':UI.phoneTab=v;render();return;
    case 'tab':UI.tab=v;render();return;
    case 'setMode':readNames();SET.mode=v;UI.err='';render();return;
    case 'setN':readNames();SET.n=+v;render();return;
    case 'start':
      readNames();UI.err='';
      if(SET.mode==='local'){localNew();render();return}
      UI.busy=true;render();
      try{const r=await api('/api/create',{mode:SET.mode,threshold:SET.threshold,caseId:SET.caseId,teams:SET.n,names:SET.names.slice(0,SET.n)});
        lsSet('hamlet21-host',{code:r.code,key:r.key});UI.online=true;connect({room:r.code,role:'host',key:r.key})}
      catch(err){UI.err='Не удалось создать комнату: '+err.message}
      UI.busy=false;render();return;
    case 'rejoinHost':{const h=hostCreds();if(!h)return;try{await api('/api/room?code='+h.code)}catch(err){lsDel('hamlet21-host');UI.err='Комната '+h.code+' больше не существует (сервер перезапускался).';render();return}
      UI.online=true;connect({room:h.code,role:'host',key:h.key});return}
    case 'lStartTurn':localStartTurn();render();return;
    case 'lNext':localAdvance();render();return;
    case 'clSel':UI.cl[b.dataset.f]=+v;render();return;
    case 'lClose':{const u=G.teams[G.closureIdx];if(UI.cl.org==null||UI.cl.goal==null)return;u.closure={org:UI.cl.org,goal:UI.cl.goal,done:true};localNextClosure();render();return}
    case 'hStart':hostAct('start');return;
    case 'hReveal':hostAct('reveal');return;
    case 'hNext':hostAct('next');return;
    case 'hFinal':hostAct('final');return;
    case 'hTimer':hostAct('timer',+v);return;
    case 'pteam':UI.team=v;render();return;
    case 'pjoin':{const nm=(document.getElementById('pname')||{}).value||'';UI.pname=nm;
      if(!nm.trim()){UI.err='Введите имя.';render();return}
      if(ROOMINFO.mode==='teams'&&!UI.team){UI.err='Выберите команду.';render();return}
      UI.busy=true;UI.err='';render();
      try{const r=await api('/api/join',{room:ROOMINFO.code,name:nm,team:UI.team});lsSet('hamlet21-player-'+ROOMINFO.code,{pid:r.pid,key:r.key,name:r.name});
        connect({room:ROOMINFO.code,role:'player',pid:r.pid,key:r.key})}catch(err){UI.err=err.message}
      UI.busy=false;render();return}
    case 'pcaptain':playerAct('captain');return;
    case 'pClose':if(UI.cl.org==null||UI.cl.goal==null)return;playerAct('closure',{org:UI.cl.org,goal:UI.cl.goal});return;
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.slot[data-a]')){e.preventDefault();e.target.click()}});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.tn!==undefined)SET.names[+el.dataset.tn]=el.value;
  if(el.dataset.set)SET[el.dataset.set]=+el.value;
  if(el.hasAttribute('data-link')){UI.link=el.value;const box=el.closest('.paper');if(box){const v=UI.link.trim();if(/^https?:\/\//.test(v)){render();const n=document.getElementById('link');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}}}}
  if(el.hasAttribute('data-pname'))UI.pname=el.value;
  if(el.dataset.refl!==undefined)lsSet('hamlet21-refl-'+el.dataset.refl,el.value);
  if(el.dataset.j){const J=jget();J[el.dataset.j]=J[el.dataset.j]||{};J[el.dataset.j][el.dataset.f]=el.value;jset(J)}
  if(el.hasAttribute('data-jnote')){const J=jget();J.note=el.value;jset(J)}
});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.set)SET[el.dataset.set]=+el.value});

/* ======================= ЗАПУСК ======================= */
async function ping(){if(!/^https?:$/.test(location.protocol))return false;
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),2500);const r=await fetch('/api/ping',{signal:c.signal,cache:'no-store'});clearTimeout(t);if(!r.ok)return false;const j=await r.json();return !!j.ok}catch(e){return false}}
async function boot(){
  const room=(qs.get('room')||'').toUpperCase();
  if(room)APP='player';else if(location.hash==='#phone')APP='ref';
  if(APP==='host'){G=lsGet(LKEY);if(G&&!G.teams)G=null}
  render();
  if(APP==='ref')return;
  ONLINE=await ping();
  if(APP==='player'){
    if(!ONLINE){UI.err='Сервер игры недоступен. Проверьте подключение к интернету.';render();return}
    try{ROOMINFO=await api('/api/room?code='+encodeURIComponent(room))}catch(err){UI.err=err.message;lsDel('hamlet21-player-'+room);render();return}
    const p=playerCreds();if(p)connect({room,role:'player',pid:p.pid,key:p.key});
    render();return;
  }
  render();
}
window.addEventListener('hashchange',()=>{if(location.hash==='#phone'&&APP==='host'){APP='ref';render()}});
boot();

</script>
